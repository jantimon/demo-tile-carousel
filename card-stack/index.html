<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carousel — card stack</title>
<link rel="stylesheet" href="carousel.css">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="deck.css">

<div class="carousel">
  <ul class="track" tabindex="0" aria-label="Recipes">
    <li>
      <article class="card">
        <div class="media"></div>
        <span class="badge">18 MIN</span>
        <div class="caption">
          <h2>Egg Fried Dhal</h2>
          <p>Warm. Nutty. Ready before the rice is.</p>
        </div>
      </article>
    </li>
    <li>
      <article class="card">
        <div class="media"></div>
        <span class="badge">27 MIN</span>
        <div class="caption">
          <h2>Green Curry</h2>
          <p>Creamy, fresh, good every time.</p>
        </div>
      </article>
    </li>
    <li>
      <article class="card">
        <div class="media"></div>
        <span class="badge">22 MIN</span>
        <div class="caption">
          <h2>Red Lentil Stew</h2>
          <p>One pot, six things, no fuss.</p>
        </div>
      </article>
    </li>
  </ul>
</div>
