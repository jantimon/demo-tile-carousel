<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carousel — pill dots, windowed</title>
<link rel="stylesheet" href="carousel.css">
<link rel="stylesheet" href="dots.css">

<div class="carousel" style="--slide-count: 10; --max-dots: 5">
  <ul class="track" tabindex="0" aria-label="Product images">
    <li id="s1">Item 1</li>
    <li id="s2">Item 2</li>
    <li id="s3">Item 3</li>
    <li id="s4">Item 4</li>
    <li id="s5">Item 5</li>
    <li id="s6">Item 6</li>
    <li id="s7">Item 7</li>
    <li id="s8">Item 8</li>
    <li id="s9">Item 9</li>
    <li id="s10">Item 10</li>
  </ul>
  <nav class="dots" aria-label="Slides">
    <div class="strip">
      <a href="#s1" aria-label="Slide 1"></a>
      <a href="#s2" aria-label="Slide 2"></a>
      <a href="#s3" aria-label="Slide 3"></a>
      <a href="#s4" aria-label="Slide 4"></a>
      <a href="#s5" aria-label="Slide 5"></a>
      <a href="#s6" aria-label="Slide 6"></a>
      <a href="#s7" aria-label="Slide 7"></a>
      <a href="#s8" aria-label="Slide 8"></a>
      <a href="#s9" aria-label="Slide 9"></a>
      <a href="#s10" aria-label="Slide 10"></a>
    </div>
  </nav>
</div>
